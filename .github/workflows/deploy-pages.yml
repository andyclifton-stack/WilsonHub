name: Deploy Wilson Hub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        timeout-minutes: 35
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo
            const artifactName = 'github-pages'
            const timeoutMs = 30 * 60 * 1000
            const pollingIntervalMs = 5000
            const terminalFailures = new Map([
              ['deployment_failed', 'Deployment failed; try again later.'],
              ['deployment_perms_error', 'Deployment failed because of file permissions.'],
              ['deployment_content_failed', 'Deployment content was rejected.'],
              ['deployment_cancelled', 'Deployment was cancelled.'],
              ['deployment_lost', 'Deployment failed to report final status.']
            ])

            const artifacts = await github.paginate(
              'GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts',
              { owner, repo, run_id: context.runId, name: artifactName, per_page: 100 }
            )
            if (artifacts.length !== 1) {
              throw new Error(`Expected one ${artifactName} artifact, found ${artifacts.length}.`)
            }

            const oidcToken = await core.getIDToken()
            const { data: deployment } = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                owner,
                repo,
                artifact_id: artifacts[0].id,
                pages_build_version: context.sha,
                oidc_token: oidcToken
              }
            )
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop() || context.sha
            core.setOutput('page_url', deployment.page_url || '')
            core.info(`Created Pages deployment ${deploymentId}; waiting up to 30 minutes.`)

            const deadline = Date.now() + timeoutMs
            while (Date.now() < deadline) {
              await new Promise(resolve => setTimeout(resolve, pollingIntervalMs))
              const { data: status } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                { owner, repo, deployment_id: deploymentId }
              )
              core.info(`Current status: ${status.status}`)
              if (status.status === 'succeed') {
                core.info('Reported success!')
                return
              }
              if (terminalFailures.has(status.status)) {
                throw new Error(terminalFailures.get(status.status))
              }
            }

            await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',
              { owner, repo, deployment_id: deploymentId }
            )
            throw new Error('Pages deployment remained queued for 30 minutes and was cancelled.')
